[package]
name = "graydb"
version = "0.1.0"
edition = "2024"
description = "GrayDB application: data access / settlement persistence layer"

[dependencies]
account = { path = "../account" }
rust_decimal =  { version = "1.43.0", features = ["macros", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# 阶段 3.4 网络发送侧。内核不依赖它（`Engine` 既不需要 `Send` 也不需要 runtime），
# 只有 `net.rs` 的任务用得上；features 按实际用到的最小集合列。
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }